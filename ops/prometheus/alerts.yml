# Prometheus alerting rules for Harmost.
#
# Two things shape this file.
#
# First, Harmost is the component that is supposed to stay up while the origin
# struggles. So the alerts are mostly about the *origin's* health as Harmost
# observes it, and only secondarily about Harmost itself — a page saying
# "Harmost is shedding" is really saying "your origin cannot keep up", and the
# annotation says so rather than leaving the reader to work it out at 3am.
#
# Second, every threshold here is a starting point, not a recommendation. The
# right value for `for:` depends on your deploy cadence and the right shed rate
# depends on how much load shedding you consider normal. They are written as
# obvious knobs rather than tuned numbers pretending to be universal.
#
# `job` and `instance` come from your scrape config. Every other label used
# below is config-derived on Harmost's side — route ids, upstream addresses,
# limiter names — and never client-controlled, so none of these rules can be
# made expensive by traffic.

groups:
  - name: harmost-availability
    rules:
      - alert: HarmostDown
        expr: up{job="harmost"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Harmost instance {{ $labels.instance }} is not being scraped"
          description: >-
            The metrics endpoint has been unreachable for two minutes. Check
            whether the process is alive at all: /health/live on the admin
            listener answers 200 whenever it is running, including while it is
            draining.

      # A drain is normal during a deploy and abnormal an hour later. An
      # instance stuck here is serving correctly and reporting itself
      # not-ready, so a load balancer has withdrawn it and nothing is watching.
      - alert: HarmostDrainingTooLong
        expr: harmost_draining == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has been draining for 15 minutes"
          description: >-
            Draining means readiness answers 503 while the process keeps
            serving. Expected during a restart; after 15 minutes it usually
            means a deploy stalled, or a SIGUSR1 was sent and never followed
            by a SIGTERM. /status reports why it entered the state.

      - alert: HarmostNoHealthyUpstream
        expr: max by (job, instance) (harmost_upstream_healthy) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No healthy origin behind {{ $labels.instance }}"
          description: >-
            Every backend is failing its health check. Harmost keeps serving
            anyway — refusing to pick would turn a degraded origin into a
            guaranteed outage — so what users see now depends on
            stale_if_error and on whatever the origin still manages. This is
            an origin problem, not a Harmost problem.

  - name: harmost-origin-load
    rules:
      # The signal that Harmost is doing its job *and* that users are seeing
      # 503s for it. Both halves belong in the annotation.
      - alert: HarmostSheddingLoad
        expr: |
          sum by (job, instance, route) (rate(harmost_admission_total{decision=~"shed_.*"}[5m]))
            /
          clamp_min(sum by (job, instance, route) (rate(harmost_admission_total[5m])), 0.001)
            > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is shedding >5% of route {{ $labels.route }}"
          description: >-
            The origin concurrency ceiling is being hit and requests are being
            refused to protect it. This is the mechanism working, and it is
            also users receiving 503. Look at harmost_origin_latency_seconds
            before raising the ceiling: a higher ceiling against a slower
            origin makes the origin slower still.

      - alert: HarmostOriginSaturated
        expr: |
          sum by (job, instance, limiter) (harmost_origin_in_flight)
            >=
          sum by (job, instance, limiter) (harmost_concurrency_limit)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Limiter {{ $labels.limiter }} on {{ $labels.instance }} is at its ceiling"
          description: >-
            Every origin permit has been held continuously for ten minutes.
            Either the origin got slower or traffic grew. Check the queue
            depth alongside this: a full ceiling with an empty queue is a
            system running exactly at capacity, and a full ceiling with a
            growing queue is one that is about to start shedding.

      - alert: HarmostQueueDepthGrowing
        expr: sum by (job, instance, limiter) (harmost_queue_depth) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Requests have been queueing on {{ $labels.limiter }} for 15 minutes"
          description: >-
            A queue that never empties is latency added to every request
            rather than capacity being smoothed. Either the ceiling is too low
            for sustained traffic, or the origin's per-request time has grown.

      - alert: HarmostOriginLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, instance, route, le) (rate(harmost_origin_latency_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 origin render on {{ $labels.route }} is above 5s"
          description: >-
            Measured from Harmost's side, so it includes the origin's own
            queueing. With a response spool this is genuinely the render time;
            without one a slow client can inflate it, and the access log's
            permit_released field distinguishes the two.

  - name: harmost-resources
    rules:
      # A cache pinned at its budget is only a problem when the hit ratio is
      # also poor: that combination means eviction is destroying entries
      # before they are reused, which is worse than not caching at all.
      - alert: HarmostCacheThrashing
        expr: |
          (
            sum by (job, instance) (harmost_cache_bytes)
              /
            clamp_min(sum by (job, instance) (harmost_cache_max_bytes), 1)
          ) > 0.95
          and
          (
            sum by (job, instance) (rate(harmost_cache_total{status="hit"}[10m]))
              /
            clamp_min(sum by (job, instance) (rate(harmost_reuse_eligible_requests_total[10m])), 0.001)
          ) < 0.2
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Cache on {{ $labels.instance }} is full with a hit ratio below 20%"
          description: >-
            The working set does not fit in cache.max_memory and entries are
            being evicted before they are reused. Either raise the budget, or
            shorten the TTL and narrow the cache key so fewer, hotter entries
            are kept.

      - alert: HarmostSpoolBudgetExhausted
        expr: sum by (job, instance) (rate(harmost_spool_total{reason="budget_exhausted"}[10m])) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Responses on {{ $labels.instance }} are exceeding the spool budget"
          description: >-
            Those responses degrade to the old behaviour: an origin permit is
            held until the client finishes reading, bounded by
            timeouts.downstream_write. Correct, but it is the coupling the
            spool exists to remove. Raise spool.max_memory if it is sustained.

      # Costs traces, never requests. Included because it is easy to miss and
      # the fix is one number.
      - alert: HarmostDroppingSpans
        expr: sum by (job, instance) (rate(harmost_spans_total{outcome="dropped"}[10m])) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} is dropping spans"
          description: >-
            The tracing queue is full for the traffic level. Spans are dropped
            rather than buffered, deliberately — a telemetry queue that grows
            under load is a memory-exhaustion bug that fires during the
            incident you wanted the traces for. Raise
            telemetry.tracing.otlp.max_queue, or sample less.

      - alert: HarmostSpanExportFailing
        expr: |
          sum by (job, instance) (rate(harmost_spans_total{outcome="export_failed"}[10m]))
            /
          clamp_min(sum by (job, instance) (rate(harmost_spans_total{outcome=~"exported|export_failed"}[10m])), 0.001)
            > 0.5
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} cannot reach its OTLP collector"
          description: >-
            Traffic is unaffected — export failure is counted and logged, never
            propagated to a request. Check the collector.

  # Only fires when origin.breaker or origin.retry is enabled; with both off
  # the series exist and stay flat, so these rules are inert rather than
  # broken.
  - name: harmost-origin-resilience
    rules:
      # The case passive observation exists for, and the one an active health
      # check cannot express: the backend answers its probe and fails real
      # requests.
      - alert: HarmostUpstreamEjectedWhileHealthy
        expr: harmost_upstream_ejected == 1 and on (job, instance, upstream) harmost_upstream_healthy == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.upstream }} passes its health check and fails real requests"
          description: >-
            Its circuit breaker is open while its health probe still passes.
            That is not a contradiction — it is an origin answering a static
            health path in a millisecond while its renders throw. Read that
            backend's own logs; harmost_upstream_failures_total says whether
            the failures are connect-level or status-level.

      # Every breaker open means the ejection cap has taken over and breaker
      # state is being ignored entirely, which is the correct behaviour and a
      # much bigger problem than one bad backend.
      - alert: HarmostAllUpstreamsEjected
        expr: >-
          sum by (job, instance) (harmost_upstream_ejected)
            == count by (job, instance) (harmost_upstream_ejected)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Every backend behind {{ $labels.instance }} is ejected"
          description: >-
            Past origin.breaker.max_ejected_percent Harmost ignores breaker
            state and routes on health alone, because if everything is broken
            then "broken" has stopped being a reason to prefer one backend
            over another. This is an origin-wide failure — a shared database,
            a dependency, a bad deploy — not a backend one.

      # A backend that recovers enough to pass and then fails again is usually
      # worse than one that stays down: each cycle sends live traffic at it.
      - alert: HarmostUpstreamFlapping
        expr: increase(harmost_upstream_breaker_trips_total[30m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.upstream }} has been ejected repeatedly in the last 30 minutes"
          description: >-
            Its breaker keeps opening, recovering on a probe, and opening
            again. Take the backend out of the pool rather than letting it
            keep half-recovering, or raise origin.breaker.open_for so each
            recovery attempt is spaced further apart.

      # Retries are failing to be affordable, which means requests are failing
      # faster than the budget will absorb. Raising the budget makes it worse.
      - alert: HarmostRetryBudgetExhausted
        expr: >-
          sum by (job, instance) (rate(harmost_origin_retries_total{outcome="budget_exhausted"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is refusing retries for lack of budget"
          description: >-
            More requests want retrying than origin.retry.budget_percent
            allows. The budget is doing its job: retries at this rate would be
            amplifying an origin failure rather than absorbing a blip. Fix the
            origin; do not raise the budget.

  - name: harmost-configuration
    rules:
      # Replicas of one deployment should agree on their effective
      # configuration. Generation is only a per-process reload counter, so
      # fleet comparison uses the stable fingerprint instead.
      - alert: HarmostConfigDiverged
        expr: count by (job) (count_values by (job) ("fingerprint", harmost_config_fingerprint)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Harmost replicas in {{ $labels.job }} are running different configurations"
          description: >-
            The stable effective-config fingerprints differ. An invalid config
            is refused and the running one kept, so a reload that failed on
            some replicas can leave them behind without stopping traffic.
            Check each instance's logs for "reload refused"; the message names
            the reason.
