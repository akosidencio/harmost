[workspace]
members = [".", "spike/pingora-cache", "bench/slow-origin"]

[package]
name = "harmost"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Origin workload governor for server-rendered applications"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
globset = "0.4"
http = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "signal"] }
pingora-core = "0.8"
pingora-proxy = "0.8"
pingora-http = "0.8"
pingora-error = "0.8"
pingora-cache = "0.8"
parking_lot = "0.12"
prometheus = "0.13"
env_logger = "0.11"
arc-swap = "1"
async-trait = "0.1"
bytes = "1"
log = "0.4"

[features]
# Exposes the internal parsers the fuzz targets drive. Not part of the public
# API: enabling it outside `fuzz/` has no purpose.
fuzzing = []

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
