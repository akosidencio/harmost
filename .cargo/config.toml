# Path remapping, for reproducible builds.
#
# Without this, the absolute path of the checkout directory and of the Cargo
# registry are baked into panic messages and debug info — so two builds of
# identical source in different directories produce different binaries, and
# "reproducible" becomes a claim nobody can check. The placeholders are stable
# strings rather than paths, so they are the same on every machine.
#
# It also stops a release binary from carrying the build machine's home
# directory in its panic output, which is a small information leak that costs
# nothing to close.
[build]
rustflags = [
    "--remap-path-prefix=/home/runner/work/harmost/harmost=/harmost",
    "--remap-path-prefix=/root/.cargo/registry/src=/cargo/registry",
    "--remap-path-prefix=/home/runner/.cargo/registry/src=/cargo/registry",
]
