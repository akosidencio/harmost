# `cargo audit` runs in CI. An advisory is ignored here only with a reason and
# a way out; an unexplained entry should be treated as a failing build.

[advisories]
ignore = [
    # protobuf 2.28.0 — crash from uncontrolled recursion when *parsing*
    # protobuf input.
    #
    # Not fixable from this crate, and not reachable in this one.
    #
    # Not fixable: protobuf arrives via `prometheus 0.13`, which is also what
    # `pingora-core 0.8` links. Metrics are served by pingora's
    # `Service::prometheus_http_service()` (see `src/main.rs`), which gathers
    # *its* prometheus default registry, while `telemetry::metrics` registers
    # into ours. Those are the same registry only for as long as both crates
    # resolve to the same `prometheus`. Bumping to `prometheus 0.14` links two
    # instances with two registries and drops every Harmost metric from
    # /metrics without an error anywhere — a worse failure than the advisory.
    # The fix is a pingora release that moves off `prometheus 0.13`.
    #
    # Not reachable: prometheus uses protobuf for its metric *data model* and
    # for the protobuf exposition format. Harmost only ever encodes metrics it
    # built itself, and no path in this binary decodes protobuf from the
    # network, which is what the advisory requires.
    "RUSTSEC-2024-0437",
]
