name: harmost-nextjs-fixture

x-next-origin: &next-origin
  build:
    context: ./fixtures/next-storefront
  expose:
    - "3000"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
    interval: 2s
    timeout: 1s
    retries: 30
  restart: unless-stopped

services:
  next-1:
    <<: *next-origin
    environment:
      INSTANCE_ID: next-1
      RENDER_DELAY_MS: "350"

  next-2:
    <<: *next-origin
    environment:
      INSTANCE_ID: next-2
      RENDER_DELAY_MS: "350"

  next-3:
    <<: *next-origin
    environment:
      INSTANCE_ID: next-3
      RENDER_DELAY_MS: "350"

  harmost:
    build:
      context: .
    depends_on:
      next-1:
        condition: service_healthy
      next-2:
        condition: service_healthy
      next-3:
        condition: service_healthy
    volumes:
      - ./bench/nextjs.yaml:/etc/harmost/harmost.yaml:ro
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    stop_grace_period: 10s
