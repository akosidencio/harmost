name: harmost-nextjs-fixture

x-next-origin: &next-origin
  image: harmost-next-origin:reference
  build:
    context: ./fixtures/next-storefront
    args:
      HARMOST_BUILD_ID: next-fixture-v1
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  expose:
    - "3000"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
    interval: 2s
    timeout: 1s
    retries: 30
  restart: unless-stopped
  depends_on:
    next-cache-init:
      condition: service_completed_successfully
  environment: &next-environment
    HARMOST_BUILD_ID: next-fixture-v1
    HARMOST_DOCTOR_TOKEN: nextjs-reference-doctor-token
    NEXT_SHARED_CACHE_DIR: /var/cache/next
  volumes:
    - next-cache:/var/cache/next

services:
  # Named volumes start as root-owned. Prepare the shared cache before the
  # non-root Next.js origins try to create entries and invalidation state.
  next-cache-init:
    image: harmost-next-origin:reference
    build:
      context: ./fixtures/next-storefront
      args:
        HARMOST_BUILD_ID: next-fixture-v1
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R nextjs:nodejs /var/cache/next"]
    volumes:
      - next-cache:/var/cache/next
    restart: "no"

  next-1:
    <<: *next-origin
    environment:
      <<: *next-environment
      INSTANCE_ID: next-1
      RENDER_DELAY_MS: "350"
    ports:
      - "127.0.0.1:13001:3000"

  next-2:
    <<: *next-origin
    environment:
      <<: *next-environment
      INSTANCE_ID: next-2
      RENDER_DELAY_MS: "350"
    ports:
      - "127.0.0.1:13002:3000"

  next-3:
    <<: *next-origin
    environment:
      <<: *next-environment
      INSTANCE_ID: next-3
      RENDER_DELAY_MS: "350"
    ports:
      - "127.0.0.1:13003:3000"

  harmost:
    build:
      context: .
    depends_on:
      next-1:
        condition: service_healthy
      next-2:
        condition: service_healthy
      next-3:
        condition: service_healthy
    volumes:
      - ${HARMOST_CONFIG_DIR:-./bench}:/etc/harmost:ro
    expose:
      - "8080"
    ports:
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:19091:9091"
    stop_grace_period: 25s
    command: ["run", "--config", "/etc/harmost/nextjs.yaml"]

  edge:
    image: nginx:1.27-alpine
    depends_on:
      - harmost
    volumes:
      - ./ops/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

volumes:
  next-cache:
