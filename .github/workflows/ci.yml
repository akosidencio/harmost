name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Reused as the release gate so a tag cannot publish untested code.
  workflow_call:

# A new push to a branch cancels the run still going for the old head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Linux is the reference platform: it runs the full gate, including the
  # end-to-end benchmarks and the containerised Next.js proof.
  test:
    name: fmt + clippy + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # pingora builds its TLS bindings from source.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      # An optional feature that is never compiled in CI rots. This also covers
      # the validation rules that branch on `cfg!(feature = "tls")`, which have
      # opposite expected outcomes in the two builds.
      - name: Clippy and test with TLS
        run: |
          cargo clippy --workspace --all-targets --locked --features tls -- -D warnings
          cargo test --workspace --lib --locked --features tls

      # --all-targets silently skips doc tests, so run them separately.
      - name: Doc tests
        run: cargo test --workspace --doc --locked

      # The operator artifacts are shipped for people to import, so they have
      # to at least parse. A dashboard that fails to import, or a rules file
      # Prometheus refuses to load, is discovered by whoever needed it during
      # an incident otherwise.
      - name: Check the operator artifacts
        run: |
          python3 -c "import json; json.load(open('ops/grafana/dashboard.json'))"
          python3 -c "import yaml; yaml.safe_load(open('ops/prometheus/alerts.yml'))"
          curl -fsSL -o /tmp/prom.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          /tmp/prometheus-2.53.2.linux-amd64/promtool check rules ops/prometheus/alerts.yml

  # A dependency advisory is a finding about code this binary runs at full
  # privilege, so it gates like any other. Ignores live in `.cargo/audit.toml`
  # and each one carries a reason and a way out.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit -D warnings

  # macOS is a supported development platform, not the reference one. It builds
  # and runs the unit tests so a platform-specific compile error or a test that
  # assumed Linux is caught; the end-to-end work is not duplicated here, because
  # the timing-sensitive benchmarks are slower and flakier on macOS runners and
  # a second copy of them buys no coverage.
  build-macos:
    name: build + test (macos)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --lib --locked

  # The end-to-end evidence behind the README's claims. Every script asserts its
  # own result and exits non-zero when it fails, so this is a gate rather than a
  # report — and each one writes the parameters it ran with next to its numbers,
  # published as an artifact so a result can be compared against another machine
  # instead of being read as a universal baseline.
  benchmarks:
    name: end-to-end benchmarks (linux)
    runs-on: ubuntu-latest
    # Longer than the unit-test job: bench/tls.sh compiles a second binary with
    # the TLS stack, and adversarial.sh, soak.sh, upgrade.sh and chaos.sh each
    # run for a fixed wall-clock span.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Record the machine the numbers came from
        run: |
          {
            echo "runner: ${{ runner.os }} ${{ runner.arch }}"
            echo "cpus: $(nproc)"
            echo "memory: $(free -h | awk '/^Mem:/ {print $2}')"
            echo "kernel: $(uname -r)"
            echo "rustc: $(rustc --version)"
            echo "commit: ${{ github.sha }}"
          } | tee benchmark-environment.txt

      # A GitHub runner has two cores, so the concurrency is kept low enough
      # that requests genuinely overlap rather than queueing behind the load
      # generator itself. The Next.js proof runs in its own job.
      - name: Run the benchmark suite
        env:
          BENCH_REPORT_DIR: ${{ github.workspace }}/benchmark-results
          SKIP_DOCKER: "1"
          DEMO_CONCURRENCY: "30"
          COALESCE_CONCURRENCY: "30"
          STREAM_CONCURRENCY: "16"
          SAFETY_CONCURRENCY: "20"
          # The spool benchmark asserts on its own control case, so its
          # parameters have to keep a two-core runner slow enough to reproduce
          # the problem being fixed. It fails loudly rather than passing
          # vacuously if they do not.
          SPOOL_MIB: "8"
          SPOOL_RATE: "24k"
          ADVERSARIAL_SECONDS: "20"
          # Phase-2 operability scripts, at CI size. These are smoke-sized on
          # purpose: they prove the mechanisms and the assertions still work.
          # The numbers that actually gate a release are far larger and run
          # before a tag — see docs/RELEASE-GATES.md. A one-minute soak cannot
          # find a leak of a few kilobytes per thousand requests, and this
          # workflow does not claim it can.
          UPGRADE_SECONDS: "6"
          SOAK_SECONDS: "45"
          SOAK_WORKERS: "8"
          MEMORY_ROUNDS: "6"
          MEMORY_SLOW_READERS: "12"
          CHAOS_ROUNDS: "2"
        run: ./bench/all.sh

      - name: Publish results with the parameters that produced them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            benchmark-environment.txt
          if-no-files-found: warn

  # The real-framework proof. Kept separate because it builds three Next.js
  # images and a Harmost image, and because a failure here means something
  # different from a unit test failure: the policy is wrong about Next.js, not
  # wrong about itself.
  nextjs:
    name: next.js integration proof (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: HTTP assertions
        run: ./bench/nextjs.sh

      - name: Browser-driven assertions
        run: ./bench/nextjs-browser.sh

  # Fuzz targets are built on every run so a target cannot rot unnoticed, and
  # run briefly. A short run is a smoke test, not a campaign: it catches a
  # target that panics immediately, which is the failure mode that matters for
  # keeping them alive in CI.
  fuzz:
    name: fuzz targets (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      # `rust-toolchain.toml` pins the repo to a stable release, and that file
      # wins over whatever rustup's default is — so every cargo call below is
      # explicitly `+nightly`. cargo-fuzz needs it for `-Zsanitizer=address`.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every target
        run: cargo +nightly fuzz build

      - name: Run each target briefly
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "=== $target ==="
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -print_final_stats=1
          done

      - name: Publish any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
