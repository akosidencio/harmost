# Benchmark config: a hard ceiling of 10 concurrent renders.
#
# `@LISTEN@` and `@ORIGIN@` are substituted by bench/lib.sh with ports
# allocated for this run. Hardcoding 8080/3000 made every benchmark collide
# with whatever else the machine was already running.
version: 1
server:
  listen: "127.0.0.1:@LISTEN@"
origin:
  upstreams: ["127.0.0.1:@ORIGIN@"]
  load_balancing: round_robin
  concurrency:
    max: 10
    queue:
      max: 500
      timeout: 20s
cache:
  enabled: false
debug_headers: true
routes:
  - id: pages
    match: "/**"
    class: public_ssr
